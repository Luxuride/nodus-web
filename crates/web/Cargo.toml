[package]
name = "nodus-web"
description = "Leptos web client: Mastodon client with a recommendation Feed tab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nodus-shared = { workspace = true }
nodus-sdk = { workspace = true }
# Transports live outside the SDK facade so a consumer chooses its stack.
nodus-instance-rest = { workspace = true }
nodus-discovery = { workspace = true }
console_error_panic_hook = "0.1"
leptos = { version = "0.8.23", features = ["csr"] }
# `localStorage` session record (milestone 1; PKCE replaces it — see bridge.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The API base is built with `web_sys::Url` but handed to the transports as a
# `url::Url`, so the two cannot disagree about a trailing slash.
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "History",
    "Location",
    "Storage",
    "Url",
    "Window",
] }
