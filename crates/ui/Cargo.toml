[package]
name = "nodus-ui"
version = "0.1.0"
description = "The marks both paint: the frame, the rail and the pieces a page composes"
edition = "2024"

[dependencies]
nodus-client-core = { path = "../../../sdk/crates/client-core", version = "0.1.0", default-features = false }
leptos = { version = "0.8", default-features = false }
icondata = { version = "0.5", default-features = false, features = ["lucide"] }
blurhash = "0.2.3"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { workspace = true }


[lints]
workspace = true

[dev-dependencies]
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
jxl-oxide = "0.12.6"
web-sys = { version = "0.3", features = ["Window", "Response"] }
gloo-net = { version = "0.6", features = ["http"] }
