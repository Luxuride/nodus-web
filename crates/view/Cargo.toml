[package]
name = "nodus-view"
version = "0.1.0"
description = "The marks both the browser and the server draw: the frame, the rail and the components around them"
edition = "2024"

[dependencies]
nodus-instance = { path = "../../../sdk/crates/instance", version = "0.1.0", default-features = false }
nodus-shared = { path = "../../../sdk/crates/shared", version = "0.1.0" }
nodus-state = { path = "../../../sdk/crates/state", version = "0.1.0" }
nodus-web = { path = "../web-shared", version = "0.1.0" }
leptos = { version = "0.8", default-features = false }
# Glyph geometry from a maintained set (Lucide) instead of paths drawn by hand here.
icondata = { version = "0.5", default-features = false, features = ["lucide"] }

[lints]
workspace = true

[dev-dependencies]
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
serde_json = "1"
