[package]
name = "nodus-web-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The browser artifact: the wasm module trunk builds, mounting the shared app."

# A binary-only package, and its own crate root. The DOM code lives here (it cannot compile
# for x86_64), the server lives in `nodus-web-server`, and neither package can enable the
# other's renderer: Cargo unifies features per invocation, so one package holding both
# would compile `leptos` with `csr` and `ssr` at once — which does not build.
[[bin]]
name = "nodus-web"
path = "src/main.rs"

[features]
default = ["hydrate"]

# What this artifact is, spelled out so the build is explicit: `trunk build --release`.
hydrate = ["leptos/csr", "nodus-mastodon/wasm"]

# The moderation screens. Same meaning as in the shared vocabulary; the screens themselves
# live in this crate, so the feature is read here.
admin = []

[dependencies]
# The one shared vocabulary: the route table and the addresses it maps to.
nodus-web = { path = "../web-shared" }
# Every screen is composed from these components; the server renders the same ones.
nodus-ui = { path = "../ui" }
nodus-pages = { path = "../pages" }
nodus-route = { path = "../route" }
nodus-editor = { path = "../editor" }
leptos = { version = "0.8.23", features = ["csr"] }
nodus-shared = { workspace = true }
nodus-client-sdk = { workspace = true }
nodus-discovery = { workspace = true }
nodus-client-core = { path = "../../../sdk/crates/client-core", version = "0.1.0" }
nodus-mastodon = { path = "../../../sdk/crates/mastodon", version = "0.1.0", features = ["wasm"] }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"
# `localStorage` session record, holding the token that sign-in produced. Hand-encoded on
# purpose: one obvious format in one obvious place.
url = "2"
# The two form-encoded `POST`s of the OAuth flow. No JSON feature: responses are read with
# the browser's own parser.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The browser has no `std::time::Instant`: `web-time` reads `performance.now()`.
web-time = "1.1"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Crypto",
    "History",
    "Location",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "MediaQueryList",
    "MediaQueryListEvent",
    "PointerEvent",
    "ProgressEvent",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
    "XmlHttpRequestUpload",
    "Navigator",
    "Storage",
    "SubtleCrypto",
    "Url",
    "UrlSearchParams",
    "Blob",
    "File",
    "FileList",
    "HtmlDetailsElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Window",
] }

# `trunk` looks for this in the package that owns `index.html`, so it is named here rather
# than in the shared crate: the crate that is built is the crate that is configured.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
