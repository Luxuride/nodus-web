[package]
name = "nodus-editor"
version = "0.1.0"
description = "The ProseMirror body and emoji picker the composer mounts in the browser"
edition = "2024"

[dependencies]
nodus-ui = { path = "../ui", version = "0.1.0" }
nodus-pages = { path = "../pages", version = "0.1.0" }
nodus-client-core = { path = "../../../sdk/crates/client-core", version = "0.1.0", default-features = false }
leptos = { version = "0.8", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlHeadElement",
    "HtmlElement",
    "Window",
    "console",
] }

[lints]
workspace = true
