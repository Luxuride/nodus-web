[build]
target = "crates/web-client/index.html"
dist = "dist"
release = true

# `crates/web/style/tailwind.css` and `crates/web/public/vendor/` are generated, not
# committed: `crates/web-client/build.rs` compiles them from `style/app.css` and `js/`
# when they are missing or stale. Node and `npm ci` are needed for that first build, which
# is what the devcontainer feature and `.devcontainer/post-create.sh` provide.

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[[proxy]]
backend = "http://127.0.0.1:3000/api"
rewrite = "/api"
