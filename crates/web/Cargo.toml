[package]
name = "nodus-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The route table both artifacts share: screens, their paths, and the sections a bare path stands for."

# A library with no renderer and no platform: it names neither `web_sys` nor axum, so it
# compiles for wasm32 and for the host alike. The client (`nodus-web-client`) and the server
# (`nodus-web-server`) are separate binary packages that both depend on it; that separation
# is what keeps `leptos/csr` and `leptos/ssr` out of the same build.
[lib]
path = "src/lib.rs"

