[build]
target = "crates/web/index.html"
dist = "dist"
release = true

# `crates/web/style/tailwind.css` is committed, not compiled here: Tailwind and daisyUI
# come from `web/package.json`, and neither Node nor a network is required to build the
# crate. Regenerate it with `npm run css` after changing a class name or a theme.

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[[proxy]]
backend = "http://127.0.0.1:3000/api"
rewrite = "/api"
