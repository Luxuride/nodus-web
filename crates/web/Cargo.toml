[package]
name = "nodus-web"
description = "Leptos web client: Mastodon client with a recommendation Feed tab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nodus-shared = { workspace = true }
nodus-sdk = { workspace = true }
# Transports live outside the SDK facade so a consumer chooses its stack.
nodus-instance-rest = { workspace = true }
nodus-discovery = { workspace = true }
console_error_panic_hook = "0.1"
leptos = { version = "0.8.23", features = ["csr"] }
# `localStorage` session record (milestone 1; PKCE replaces it — see bridge.rs).
# Hand-encoded on purpose: `serde_json` is in the bundle anyway through `gloo-net`,
# so this is not a size decision — it is one obvious format in one obvious place.
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "History",
    "Location",
    "Storage",
    "Url",
    "Window",
] }
