[package]
name = "nodus-web-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The SSR host: a cookie session in, HTML out, rendered by the same components as the client."

# Binary-only. This artifact must never enable the client, and a workspace build must never
# combine the two paints: Cargo unifies features per invocation, so one package holding both
# would compile `leptos` with `csr` *and* `ssr` at once.
[[bin]]
name = "nodus-web-server"
path = "src/main.rs"

[features]
default = []

# A server that also carries the moderation screens, so a moderator's first paint has the
# rail's doors: `cargo build -p nodus-web-server --features admin`.
admin = []

[dependencies]
# The URL vocabulary and the route table: the one thing both artifacts must agree on.
nodus-web = { path = "../web-shared", default-features = false }
# The components. The server does not have a renderer of its own.
nodus-ui = { path = "../ui" }
nodus-pages = { path = "../pages" }
nodus-route = { path = "../route" }
# Rendering to a string, never hydrating.
leptos = { version = "0.8.23", features = ["ssr"] }
# The instance client is the SDK's native build: one place knows Mastodon's endpoints.
nodus-instance = { path = "../../../sdk/crates/instance", version = "0.1.0", features = ["native"] }
nodus-sdk = { workspace = true }
nodus-state = { path = "../../../sdk/crates/state", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
# Post bodies arrive as HTML; this keeps the parts a post is made of and nothing else.
lol_html = "2"
# Public reads of a shared link are made here, not by the reader's browser.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
# Session ids are opaque and unguessable.
uuid = { version = "1", features = ["v4"] }

# The HTTP host.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
