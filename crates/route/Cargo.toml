[package]
name = "nodus-route"
version = "0.1.0"
description = "The route renderer and the runtime contract both paints implement"
edition = "2024"

[dependencies]
nodus-ui = { path = "../ui", version = "0.1.0" }
nodus-pages = { path = "../pages", version = "0.1.0" }
nodus-client-core = { path = "../../../sdk/crates/client-core", version = "0.1.0", default-features = false }
nodus-shared = { path = "../../../sdk/crates/shared", version = "0.1.0" }
nodus-state = { path = "../../../sdk/crates/state", version = "0.1.0" }
nodus-web = { path = "../web-shared", version = "0.1.0" }
leptos = { version = "0.8", default-features = false }

[lints]
workspace = true

[dev-dependencies]
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
