[package]
name = "nodus-server"
description = "The server-rendered first page: a cookie session, an instance call, and HTML before the wasm boots"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/nodus-social/nodus-web"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The instance client is the SDK's native build, not a second hand-rolled HTTP layer:
# one place knows where Mastodon's endpoints are and what its payloads look like.
nodus-instance = { path = "../../../sdk/crates/instance", version = "0.1.0", features = ["native"] }
lol_html = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
